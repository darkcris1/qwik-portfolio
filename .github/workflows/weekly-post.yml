name: Scheduled blog post

on:
  schedule:
    - cron: "0 0 * * *" # 08:00 Manila time daily; the step below only posts every 3rd day
  workflow_dispatch:

# Overlapping runs would read the same stalest topic and post it twice.
concurrency: weekly-post

jobs:
  write-post:
    runs-on: ubuntu-latest
    # Worst case is 3 models x 2 tries x 5 min, plus waits.
    timeout-minutes: 35
    steps:
      - name: Write and save a blog post
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENDPOINT: ${{ vars.SITE_URL }}/cron/weekly-post/
        run: |
          # Count days since the epoch so the 3-day gap holds across month ends.
          if [ "${{ github.event_name }}" = "schedule" ] && [ $(( $(date -u +%s) / 86400 % 3 )) -ne 0 ]; then
            echo "Not a posting day, skipping."
            exit 0
          fi

          # JSON content type skips Qwik's CSRF check, which only guards form posts.
          call_site() {
            curl --fail-with-body -sSL -X POST "$ENDPOINT" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data-binary @-
          }

          plan=$(echo '{"step":"plan"}' | call_site) || { echo "$plan"; exit 1; }
          topic=$(jq -r .topic <<<"$plan")
          echo "Topic: $topic"

          # Gemini runs here because it can take longer than Vercel lets a request live.
          models=$(jq -r '.models[]?' <<<"$plan")
          if [ -z "$models" ]; then
            echo "Plan has no models list (got keys: $(jq -c 'keys' <<<"$plan")). Is the latest site deployed?"
            exit 1
          fi

          gemini=""
          for model in $models; do
            req=$(jq -c .request <<<"$plan")
            tries=0
            while :; do
              tries=$((tries + 1))
              if gemini=$(curl --fail-with-body -sS --max-time 300 -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent" \
                -H "x-goog-api-key: $GEMINI_API_KEY" \
                -H "Content-Type: application/json" \
                --data-binary "$req"); then
                echo "Written by $model"
                break 2
              fi
              code=$(jq -r '.error.code // empty' <<<"$gemini" 2>/dev/null || true)
              code=${code:-network}
              echo "$model try $tries failed ($code): $(jq -r '.error.message // empty' <<<"$gemini" 2>/dev/null | head -c 200 || true)"
              gemini=""
              if [ "$code" = "400" ] && jq -e '.generationConfig.thinkingConfig' <<<"$req" >/dev/null; then
                # Some models reject thinkingLevel, so retry once without it.
                req=$(jq -c 'del(.generationConfig.thinkingConfig)' <<<"$req")
                continue
              fi
              # Only busy, rate-limited or network errors get one more try on the same model.
              case "$code" in 503|429|network) ;; *) break ;; esac
              [ "$tries" -lt 2 ] || break
              sleep 30
            done
          done
          [ -n "$gemini" ] || { echo "Every Gemini model failed, try again later."; exit 1; }
          reason=$(jq -r '.candidates[0].finishReason // "none"' <<<"$gemini")
          if [ "$reason" != "STOP" ]; then
            echo "Gemini stopped early (finishReason: $reason)"
            exit 1
          fi

          # Join every non-thought part, since thinking models can split the reply.
          saved=$(jq -c --arg topic "$topic" \
            '{step: "save", topic: $topic, text: ([.candidates[0].content.parts[]? | select(.thought != true) | .text // empty] | join(""))}' \
            <<<"$gemini" | call_site) || { echo "$saved"; exit 1; }
          echo "$saved"
